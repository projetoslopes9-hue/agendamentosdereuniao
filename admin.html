<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel administrativo</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#1f2937;font:15px Segoe UI,Arial,sans-serif}.top{background:#fff;border-bottom:1px solid #e5e7eb;padding:18px max(18px,calc((100% - 1100px)/2));display:flex;justify-content:space-between;align-items:center;gap:12px}.wrap{max-width:1100px;margin:28px auto;padding:0 16px}.card{background:white;border:1px solid #e5e7eb;border-radius:14px;padding:22px;margin-bottom:18px}label{display:block;margin:12px 0 5px;font-weight:600}input{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:8px}button{background:#2563eb;color:white;border:0;border-radius:8px;padding:10px 14px;cursor:pointer;font-weight:650}button.secondary{background:#e8eefb;color:#1d4ed8}button.danger{background:#b91c1c}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row button{margin-top:12px}.muted{color:#64748b;font-size:13px}.hidden{display:none!important}.item{padding:15px 0;border-bottom:1px solid #e5e7eb}.item:last-child{border:0}.status{font-size:12px;border-radius:20px;padding:4px 8px;background:#fef3c7;color:#92400e}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}#feedback{margin-top:12px;color:#b91c1c}
</style></head><body>
<header class="top"><strong>📅 Painel de agendamentos</strong><button id="logout" class="secondary hidden">Sair</button></header>
<main class="wrap">
<section id="loginCard" class="card" style="max-width:440px;margin:50px auto"><h2>Entrar como administrador</h2><p class="muted">Use a conta cadastrada no Firebase Authentication.</p>
<form id="loginForm"><label for="email">E-mail</label><input id="email" type="email" autocomplete="username" required><label for="password">Senha</label><input id="password" type="password" autocomplete="current-password" required><button style="margin-top:16px;width:100%">Entrar</button></form><div id="feedback"></div></section>
<section id="dashboard" class="hidden"><div class="card"><h2>Solicitações recebidas</h2><p class="muted">Somente a conta de administrador autorizada pode ver esta lista.</p><div id="requests">Carregando…</div></div><div class="card"><h2>Reuniões confirmadas</h2><div id="confirmed">Carregando…</div></div></section>
</main><script type="module" src="./admin.js"></script></body></html>
